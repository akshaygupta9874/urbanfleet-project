_format_version: "3.0"

services:
  # ========================================================
  # 1. AUTH SERVICE (Internal Port 4001)
  # ========================================================
  - name: auth-service
    url: http://auth-service:4001
    routes:
      - name: auth-routes
        paths:
          - /auth
          - /admin
          - /api/auth
          - /v1/auth
          - /api/admin
          - /v1/admin
        strip_path: false
        protocols:
          - http
          - https
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local

  # ========================================================
  # 2. DRIVER SERVICE (Internal Port 4002)
  # ========================================================
  - name: driver-service
    url: http://driver-service:4002
    routes:
      - name: driver-routes
        paths:
          - /driver
          - /drivers
          - /api/driver
          - /api/drivers
          - /v1/driver
          - /v1/drivers
        strip_path: false
        protocols:
          - http
          - https

  # ========================================================
  # 3. RIDE SERVICE (HTTP - Internal Port 4004)
  # ========================================================
  - name: ride-service
    url: http://ride-service:4004
    routes:
      - name: ride-routes
        paths:
          - /ride
          - /rides
          - /api/ride
          - /api/rides
          - /v1/ride
          - /v1/rides
        strip_path: false
        protocols:
          - http
          - https

  # ========================================================
  # 4. RIDE WEBSOCKET SERVICE (Native WS Upgrade)
  # ========================================================
  - name: ride-websocket-service
    url: http://ride-service:4004
    routes:
      - name: ride-websocket-route
        paths:
          - /ws/ride
          - /ws
          - /socket
        strip_path: false
        protocols:
          - http
          - https # 👈 Native WS upgrades transparently handled over HTTP/HTTPS

  # ========================================================
  # 5. PAYMENT SERVICE (Internal Port 4005)
  # ========================================================
  - name: payment-service
    url: http://payment-service:4005
    routes:
      - name: payment-routes
        paths:
          - /payment
          - /payments
          - /webhooks
          - /api/payment
          - /api/payments
          - /v1/payment
          - /v1/payments
          - /api/webhooks
          - /v1/webhooks
        strip_path: false
        protocols:
          - http
          - https

  # ========================================================
  # 6. NOTIFICATION SERVICE (Internal Port 4003)
  # ========================================================
  - name: notification-service
    url: http://notification-service:4003
    routes:
      - name: notification-routes
        paths:
          - /notifications
          - /api/notifications
          - /v1/notifications
        strip_path: false
        protocols:
          - http
          - https

plugins:
  # Global Dynamic CORS Plugin
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://13.201.98.35:5173"
        - "^http://.*:5173$"
        - "^https://.*\\.vercel\\.app$"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - X-Request-ID
        - x-csrf-token
        - x-xsrf-token
        - csrf-token
        - x-internal-service-key
      credentials: true
      max_age: 3600

  # Global Correlation ID Plugin
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

