networks:
  urbanfleet_internal:
    driver: bridge
    internal: false # Permits outbound container requests (Razorpay, SendGrid)

services:
  # ========================================================
  # 1. DATA INFRASTRUCTURE (Self-Hosted Lightweight KRaft Kafka)
  # Database hosted on Neon Serverless PostgreSQL
  # Redis hosted on Upstash Cloud
  # ========================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urbanfleet-kafka
    restart: always
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    expose:
      - "29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urbanfleet-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka-init.sh:/tmp/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/tmp/kafka-init.sh"]
    networks:
      - urbanfleet_internal

  # ========================================================
  # 2. INGRESS: KONG API GATEWAY
  # ========================================================
  kong:
    image: kong:3.9
    container_name: urbanfleet-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_MEM_CACHE_SIZE: "64m"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "${KONG_PORT:-3001}:8000"           # 👈 Single Public Ingress Port!
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001" # 👈 Loopback Admin binding ONLY!
    networks:
      - urbanfleet_internal
    depends_on:
      - auth-service
      - driver-service
      - ride-service
      - payment-service
      - notification-service

  # ========================================================
  # 3. CORE MICROSERVICES
  # ========================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: urbanfleet-auth-service
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
    expose:
      - "4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e-pooler.c-6.us-east-2.aws.neon.tech/urbanfleet_auth?sslmode=require&connect_timeout=15}
      DIRECT_DATABASE_URL: ${AUTH_DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e.c-6.us-east-2.aws.neon.tech/urbanfleet_auth?sslmode=require&connect_timeout=15}
      REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAbq5AAIgcDIzYTliZWY4ODExZTk0NDNjYWFlNWFhNDgwNzhlNjk2Yg@crisp-pelican-113337.upstash.io:6379}
      KAFKA_BROKERS: "kafka:29092"
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-841434396195-7l7q5r78htpukv1v8muvo1jko4pm939j.apps.googleusercontent.com}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    networks:
      - urbanfleet_internal
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: urbanfleet-driver-service
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
    expose:
      - "4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: ${DRIVER_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e-pooler.c-6.us-east-2.aws.neon.tech/urbanfleet_driver?sslmode=require&connect_timeout=15}
      DIRECT_DATABASE_URL: ${DRIVER_DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e.c-6.us-east-2.aws.neon.tech/urbanfleet_driver?sslmode=require&connect_timeout=15}
      REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAbq5AAIgcDIzYTliZWY4ODExZTk0NDNjYWFlNWFhNDgwNzhlNjk2Yg@crisp-pelican-113337.upstash.io:6379}
      KAFKA_BROKERS: "kafka:29092"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    networks:
      - urbanfleet_internal
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    container_name: urbanfleet-ride-service
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
    expose:
      - "4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: ${RIDE_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e-pooler.c-6.us-east-2.aws.neon.tech/urbanfleet_ride?sslmode=require&connect_timeout=15}
      DIRECT_DATABASE_URL: ${RIDE_DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e.c-6.us-east-2.aws.neon.tech/urbanfleet_ride?sslmode=require&connect_timeout=15}
      REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAbq5AAIgcDIzYTliZWY4ODExZTk0NDNjYWFlNWFhNDgwNzhlNjk2Yg@crisp-pelican-113337.upstash.io:6379}
      KAFKA_BROKERS: "kafka:29092"
      DRIVER_SERVICE_URL: "http://driver-service:4002"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - urbanfleet_internal
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: urbanfleet-payment-service
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
    expose:
      - "4005"
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e-pooler.c-6.us-east-2.aws.neon.tech/urbanfleet_payment?sslmode=require&connect_timeout=15}
      DIRECT_DATABASE_URL: ${PAYMENT_DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e.c-6.us-east-2.aws.neon.tech/urbanfleet_payment?sslmode=require&connect_timeout=15}
      REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAbq5AAIgcDIzYTliZWY4ODExZTk0NDNjYWFlNWFhNDgwNzhlNjk2Yg@crisp-pelican-113337.upstash.io:6379}
      KAFKA_BROKERS: "kafka:29092"
      RIDE_SERVICE_URL: "http://ride-service:4004"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-sample}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-your-razorpay-webhook-secret}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    networks:
      - urbanfleet_internal
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: urbanfleet-notification-service
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    expose:
      - "4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e-pooler.c-6.us-east-2.aws.neon.tech/urbanfleet_notification?sslmode=require&connect_timeout=15}
      DIRECT_DATABASE_URL: ${NOTIFICATION_DIRECT_DATABASE_URL:-postgresql://neondb_owner:npg_P3iUGXLOJ4jV@ep-tiny-queen-b4c25v4e.c-6.us-east-2.aws.neon.tech/urbanfleet_notification?sslmode=require&connect_timeout=15}
      REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAbq5AAIgcDIzYTliZWY4ODExZTk0NDNjYWFlNWFhNDgwNzhlNjk2Yg@crisp-pelican-113337.upstash.io:6379}
      KAFKA_BROKERS: "kafka:29092"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-test-sendgrid-key}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@urbanfleet.com}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    networks:
      - urbanfleet_internal
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ========================================================
  # 4. FRONTEND
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001/ws/ride}
        VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-b2e5858ed2ec4ef1bc736c6411abe296}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-841434396195-7l7q5r78htpukv1v8muvo1jko4pm939j.apps.googleusercontent.com}
    container_name: urbanfleet-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - urbanfleet_internal
    depends_on:
      - kong

volumes:
  kafka_data:
