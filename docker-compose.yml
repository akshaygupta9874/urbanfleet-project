networks:
  urbanfleet_internal:
    driver: bridge
    internal: false # Permits outbound container requests (Razorpay, SendGrid)

services:
  # ========================================================
  # 1. DATA INFRASTRUCTURE
  # Self-Hosted Lightweight KRaft Kafka
  # ========================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urbanfleet-kafka
    restart: always
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    expose:
      - "29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urbanfleet-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka-init.sh:/tmp/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/tmp/kafka-init.sh"]
    networks:
      - urbanfleet_internal
    environment:
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TOPIC_MIN_ISR: ${KAFKA_TOPIC_MIN_ISR:-1}

  # ========================================================
  # 2. INGRESS: KONG API GATEWAY
  # ========================================================
  kong:
    image: kong:3.9
    container_name: urbanfleet-kong
    restart: always
    user: "root"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_MEM_CACHE_SIZE: "64m"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: ${KONG_PROXY_LISTEN:-0.0.0.0:8000}
      KONG_SSL_CERT: ${KONG_SSL_CERT:-}
      KONG_SSL_CERT_KEY: ${KONG_SSL_CERT_KEY:-}
      KONG_DNS_RESOLVER: "127.0.0.11"
      KONG_DNS_ORDER: "A,LAST"
      KONG_DNS_STALE_TTL: "4"
      KONG_DNS_NOT_FOUND_TTL: "5"
      KONG_DNS_ERROR_TTL: "5"
    volumes:
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    ports:
      - "${PORT_80:-80}:8000"
      - "${PORT_443:-443}:8443"
      - "${KONG_PORT:-3001}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    networks:
      - urbanfleet_internal
    depends_on:
      auth-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ========================================================
  # 3. CORE MICROSERVICES
  # ========================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: urbanfleet-auth-service
    restart: always
    command: sh -c "node scripts/wait-for-dependencies.cjs && npx prisma migrate deploy && (npx tsx prisma/seed.ts || true) && node dist/index.js"
    expose:
      - "4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${AUTH_DATABASE_URL:?Set AUTH_DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${AUTH_DIRECT_DATABASE_URL:?Set AUTH_DIRECT_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      KAFKA_BROKERS: "kafka:29092"
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    volumes:
      - ./scripts/wait-for-dependencies.cjs:/app/scripts/wait-for-dependencies.cjs:ro
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/v1/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: urbanfleet-driver-service
    restart: always
    command: sh -c "node scripts/wait-for-dependencies.cjs && npx prisma migrate deploy && (npx tsx prisma/seed.ts || true) && node dist/index.js"
    expose:
      - "4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: ${DRIVER_DATABASE_URL:?Set DRIVER_DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${DRIVER_DIRECT_DATABASE_URL:?Set DRIVER_DIRECT_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      KAFKA_BROKERS: "kafka:29092"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    volumes:
      - ./scripts/wait-for-dependencies.cjs:/app/scripts/wait-for-dependencies.cjs:ro
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/v1/drivers/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    container_name: urbanfleet-ride-service
    restart: always
    command: sh -c "node scripts/wait-for-dependencies.cjs && npx prisma migrate deploy && (npx tsx prisma/seed.ts || true) && node dist/index.js"
    expose:
      - "4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: ${RIDE_DATABASE_URL:?Set RIDE_DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${RIDE_DIRECT_DATABASE_URL:?Set RIDE_DIRECT_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      KAFKA_BROKERS: "kafka:29092"
      DRIVER_SERVICE_URL: "http://driver-service:4002"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    volumes:
      - ./scripts/wait-for-dependencies.cjs:/app/scripts/wait-for-dependencies.cjs:ro
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4004/v1/rides/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: urbanfleet-payment-service
    restart: always
    command: sh -c "node scripts/wait-for-dependencies.cjs && npx prisma migrate deploy && (npx tsx prisma/seed.ts || true) && node dist/index.js"
    expose:
      - "4005"
    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: ${PAYMENT_DATABASE_URL:?Set PAYMENT_DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${PAYMENT_DIRECT_DATABASE_URL:?Set PAYMENT_DIRECT_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      KAFKA_BROKERS: "kafka:29092"
      RIDE_SERVICE_URL: "http://ride-service:4004"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      DRIVER_SERVICE_URL: "http://driver-service:4002"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET in .env}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    volumes:
      - ./scripts/wait-for-dependencies.cjs:/app/scripts/wait-for-dependencies.cjs:ro
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4005/v1/payments/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: urbanfleet-notification-service
    restart: always
    command: sh -c "node scripts/wait-for-dependencies.cjs && npx prisma migrate deploy && node dist/index.js"
    expose:
      - "4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?Set NOTIFICATION_DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${NOTIFICATION_DIRECT_DATABASE_URL:?Set NOTIFICATION_DIRECT_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      KAFKA_BROKERS: "kafka:29092"
      AUTH_SERVICE_URL: "http://auth-service:4001"
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@urbanfleet.com}
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    volumes:
      - ./scripts/wait-for-dependencies.cjs:/app/scripts/wait-for-dependencies.cjs:ro
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4003/v1/notifications/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: urbanfleet-admin-service
    restart: always
    expose:
      - "4006"
    environment:
      NODE_ENV: production
      PORT: 4006
      AUTH_SERVICE_URL: "http://auth-service:4001"
      DRIVER_SERVICE_URL: "http://driver-service:4002"
      RIDE_SERVICE_URL: "http://ride-service:4004"
      PAYMENT_SERVICE_URL: "http://payment-service:4005"
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-urbanfleet-internal-service-secret}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 in .env}
      FRONTEND_URL: ${FRONTEND_URL:-https://urbanfleet.duckdns.org}
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4006/v1/admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================
  # 4. FRONTEND
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://urbanfleet.duckdns.org}
        VITE_WS_URL: ${VITE_WS_URL:-wss://urbanfleet.duckdns.org/ws/ride}
        VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-b2e5858ed2ec4ef1bc736c6411abe296}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: urbanfleet-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - urbanfleet_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kafka_data:
